name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t devcontainer .devcontainer
      # Both opencode versions start and see the plugin build. The checkout belongs to
      # the runner's user, so the container works on a copy as `node`.
      - run: |
          docker run --rm -u node -v "$PWD:/src:ro" devcontainer bash -euc '
            cp -r /src ~/repo && cd ~/repo
            bun install --frozen-lockfile
            bun run build
            oc1 --version
            oc2 --version
            oc2 models --standalone --print-logs --log-level info 2>&1 | grep "loading plugin"
          '
