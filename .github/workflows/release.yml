name: Release

# Every push to main updates the release PR (version bump + CHANGELOG from
# conventional commits). Merging that PR tags the release, creates the GitHub
# release and stages the version on npm through trusted publishing (OIDC, no
# token). A maintainer approves the staged version with 2FA on npmjs.com (Staged
# Packages) or with `npm stage approve <stage-id>` before it goes live.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # release-please as the klconsultancy release GitHub App (its token, not GITHUB_TOKEN,
  # so the release PR it opens triggers CI), from the shared reusable workflow. The App and
  # its credentials live at the klconsultancy organization level.
  release-please:
    permissions: {} # it acts as the app
    uses: klconsultancy/workflows/.github/workflows/release-please.yml@153c11cfe93c94e30a657a6d43f55ec44e6e13b8 # v1.0.1
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Stays here, not in the reusable workflow: npm's trusted publisher is bound to this
  # workflow file (release.yml) and the `npm` environment.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@11.19.0
      - run: bun install --frozen-lockfile
      # prepublishOnly runs typecheck, build and tests first. The trusted publisher
      # only allows staging: the version goes live once a maintainer approves it.
      - run: npm stage publish
