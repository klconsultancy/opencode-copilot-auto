name: Release

# Every push to main updates the release PR (version bump + CHANGELOG from
# conventional commits). Merging that PR tags the release, creates the GitHub
# release and stages the version on npm through trusted publishing (OIDC, no
# token). A maintainer approves the staged version with 2FA on npmjs.com (Staged
# Packages) or with `npm stage approve <stage-id>` before it goes live.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so the release PR it opens
      # triggers CI (events from GITHUB_TOKEN start no new workflow runs). The App
      # and its credentials live at the klconsultancy organization level.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@11.19.0
      - run: bun install --frozen-lockfile
      # prepublishOnly runs typecheck, build and tests first. The trusted publisher
      # only allows staging: the version goes live once a maintainer approves it.
      - run: npm stage publish
